[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench"
version = "0.0.1"
description = "InferBench: production-style GPU inference benchmarking and optimization platform (Phase 0 scaffold)."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["packages/benchmark-core/src"]

[tool.setuptools.package-dir]
"" = "packages/benchmark-core/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/benchmark-core/src", "tests"]
exclude = [".venv", "apps/api-go"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/benchmark-core/src"]
