[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench"
version = "0.1.0"
description = "InferBench: production-style GPU inference benchmarking and optimization platform."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["packages/benchmark-core/src"]

[tool.setuptools.package-dir]
"" = "packages/benchmark-core/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=benchmark_core --cov-report=term-missing"

[tool.coverage.run]
source = ["benchmark_core"]
branch = true

[tool.coverage.report]
precision = 2
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/benchmark-core/src", "tests"]
exclude = [".venv", "apps/api-go"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/benchmark-core/src"]
