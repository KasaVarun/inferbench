name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Run pytest
        run: pytest

  go:
    name: Go (1.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run go test
        working-directory: apps/api-go
        run: go test ./...
